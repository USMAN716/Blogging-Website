name: PR Validation

on:
  pull_request:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g htmlhint stylelint stylelint-config-standard
      - run: htmlhint "**/*.html" --config .htmlhintrc
      - run: npx stylelint "**/*.css" --config .stylelintrc.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g parcel
      - run: npx parcel build src/index.html --no-optimize --no-scope-hoist

